---
name: "🛠️ VPP Install Dependencies"
description: |
  This GitHub Action installs the necessary dependencies for VPP.

inputs:
  WORKSPACE:
    description: "Workspace directory where VPP is located"
    required: true
    type: string
  TUI_LINE:
    description: "Delimiter line for TUI output"
    required: false
    default: "*******************************************************************"
    type: string

runs:
  using: "composite"
  steps:
    - name: Install Dependencies
      shell: bash
      env:
        WORKSPACE: ${{ inputs.WORKSPACE }}
        TUI_LINE: ${{ inputs.TUI_LINE }}
      run: |
        set -euo pipefail
        cd "$WORKSPACE"
        echo "$TUI_LINE"
        echo "* Installing VPP dependencies"
        echo "$TUI_LINE"
        make UNATTENDED=yes install-deps
        echo "$TUI_LINE"
