name: Verify pull request

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  # A manual run has no pull request, so the steps that read the pull_request
  # context fall back to comparing the branch tip with its parent, and the
  # suites input replaces the filter derived from the changed paths.
  workflow_dispatch:
    inputs:
      suites:
        description: >-
          TEST suites that replace the derived filter, for example
          "neighbor ip_mcast linux_cp". Leave empty to derive them.
        required: false
        default: ""
        type: string

# One run per ref: a new push to the same branch cancels the previous run.
concurrency:
  group: pr-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: style
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    # A job that runs in a container gets `sh` for `run:` unless it says
    # otherwise, and debian:trixie's /bin/sh is dash, which rejects the
    # parameter expansions this repository's scripts use.
    defaults:
      run:
        shell: bash
    env:
      # extras/scripts/checkstyle.sh picks clang-format-${CLANG_FORMAT_VER};
      # the Makefile sets 19 for Debian 13, and the same value has to reach the
      # script when it is invoked directly.
      CLANG_FORMAT_VER: "19"
    steps:
      - name: Disable APT cache cleanup
        run: rm -f /etc/apt/apt.conf.d/docker-clean

      - name: Install base tools
        run: |
          apt-get update -qq
          apt-get install -y -qq sudo make git bash

      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          # The coding style and API checks diff against a parent commit, and
          # src/scripts/version reads the v* tags, so the whole history and
          # tags are needed.
          fetch-depth: 0
          fetch-tags: true

      - name: Install VPP checkstyle dependencies
        run: |
          git config --global --add safe.directory "$PWD"
          # crcchecker.py refuses to run when a tracked file is modified, so
          # this step must not rewrite the Makefile.
          make UNATTENDED=yes install-dep

      - name: Check the feature list
        run: make checkfeaturelist

      - name: Check the C coding style
        # A pull_request checkout is the merge commit, whose first parent is
        # the base branch tip, so HEAD~1..HEAD is the whole pull request.
        run: make checkstyle

      - name: Check the API for incompatible changes
        # crcchecker.py compares HEAD~1..HEAD as well, and refuses to run when
        # the working tree is dirty, so this runs before the Python check
        # builds anything.
        run: make checkstyle-api

      - name: Check the Python coding style
        run: make checkstyle-python

      - name: Check the commit messages of the pull request
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          checked_out=$(git rev-parse HEAD)
          trap 'git checkout --quiet "${checked_out}"' EXIT
          # A merge commit has no feature id in its subject, and
          # check_commit_msg.sh rejects a subject without one, so only the
          # commits the pull request author wrote are checked.
          if [ -n "${base}" ] && [ -n "${head}" ]; then
            echo "Pull request base ${base}, head ${head}"
            commits=$(git rev-list --reverse --no-merges "${base}..${head}")
          else
            # A manual run has no pull request context, and its tip is usually a
            # merge commit, which check_commit_msg.sh rejects. The commits such a
            # tip carries are the range between its first parent and itself, and
            # the merge commits inside that range are skipped for the same
            # reason. A tip with one parent, or a root commit, carries itself.
            head=$(git rev-parse HEAD)
            first_parent=$(git rev-parse --verify --quiet "${head}^1" || true)
            if [ -n "${first_parent}" ]; then
              echo "No pull request context; first parent of ${head} is ${first_parent}"
              commits=$(git rev-list --reverse --no-merges "${first_parent}..${head}")
            else
              echo "No pull request context and ${head} has no parent"
              commits=""
            fi
            if [ -z "${commits}" ]; then
              # An empty set would check nothing and pass, so the newest
              # non-merge commit reachable from the tip is checked instead.
              commits=$(git rev-list --no-merges --max-count=1 "${head}")
              if [ -z "${commits}" ]; then
                echo "::error::No commit message to check from ${head}"
                exit 1
              fi
              echo "No non-merge commit derives from ${head}; checking only ${commits}"
            fi
          fi
          checked=0
          for commit in ${commits}; do
            echo "Checking commit message of ${commit}"
            git checkout --quiet "${commit}"
            extras/scripts/check_commit_msg.sh
            checked=$((checked + 1))
          done
          echo "Checked the commit message of ${checked} commit(s) for head ${head}"

  test-plan:
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
      tunnel_control: ${{ steps.plan.outputs.tunnel_control }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan isolated ESP builds from the committed candidate
        id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import ast
          import json
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args])

          base = os.environ["PR_BASE"]
          head = os.environ["PR_HEAD"]
          if not base or not head:
              # A workflow_dispatch run has no pull request context; compare the
              # branch tip with its parent instead.
              base = subprocess.run(["git", "rev-parse", "HEAD^"], capture_output=True,
                                    text=True).stdout.strip()
              head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True,
                                    text=True).stdout.strip()
          changed = (git("diff", "--name-only", base + "..." + head).decode().splitlines()
                     if base and head else [])
          enabled = False
          if "src/vnet/tunnel/tunnel_dp.h" in changed:
              path = "test/test_ipsec_esp.py"
              exists = subprocess.run(["git", "cat-file", "-e",
                                       head + ":" + path]).returncode == 0
              if exists:
                  tree = ast.parse(git("show", head + ":" + path))
                  enabled = any(isinstance(node, ast.ClassDef) and node.name == "TestIpsecEspTun"
                                and any(isinstance(method, ast.FunctionDef) and
                                        method.name == "test_tun_df44" for method in node.body)
                                for node in tree.body)
          variants = ["fixed", "original-df"] if enabled else ["fixed"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("variants=" + json.dumps(variants) + "\n")
              output.write("tunnel_control=" + str(enabled).lower() + "\n")
          PY

  build-test:
    name: build and test (${{ matrix.variant }})
    needs: test-plan
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.test-plan.outputs.variants) }}
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      # The test framework reserves SHM_PER_PROCESS per worker on top of a
      # 1 GiB minimum; the 64 MiB container default is far too small.
      # ip netns needs mount/unshare/setns; link and TAP setup need NET_ADMIN.
      # Docker's default seccomp permits these calls with SYS_ADMIN, but its
      # AppArmor profile denies mount. Allow only the TAP/vhost misc devices.
      options: >-
        --shm-size=2g
        --cap-add=SYS_ADMIN
        --cap-add=NET_ADMIN
        --security-opt=apparmor=unconfined
        --device-cgroup-rule="c 10:200 rwm"
        --device-cgroup-rule="c 10:238 rwm"
    defaults:
      run:
        shell: bash
    env:
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Disable APT cache cleanup
        run: rm -f /etc/apt/apt.conf.d/docker-clean

      - name: Install base tools
        run: |
          apt-get update -qq
          apt-get install -y -qq sudo make git bash iproute2

      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The rules that map a changed path to a test module are written once,
      # into a file in the runner's temporary directory, so the self-check below
      # and the derive step run the same code.
      - name: Write the test-suite derivation helper
        run: |
          cat > "${RUNNER_TEMP}/derive-suites.sh" <<'HELPER'
          # One push runs at most SUITE_CAP test suites. The suites that do not
          # fit are named in the log instead of being dropped without a word, so
          # the selection and the drop report both read this one value.
          SUITE_CAP=3

          # A bare suite name resolves to test/test_<name>.py or
          # test/asf/test_<name>.py. A rule that resolves to no module selects
          # no test at all, so it reports itself instead of returning nothing.
          suite_module_exists() {
            [ -f "test/test_$1.py" ] || [ -f "test/asf/test_$1.py" ]
          }

          # src/vnet/<dir> directories whose test module is named differently
          # from the directory. Every other directory keeps its own name.
          suite_module_alias() {
            case "$1" in
              ip-neighbor) printf '%s\n' neighbor ;;
              mfib) printf '%s\n' ip_mcast ;;
            esac
          }

          report_uncovered() {
            local path="$1" candidate looked=""
            shift
            for candidate in "$@"; do
              looked="${looked}${looked:+, }test/test_${candidate}.py or test/asf/test_${candidate}.py"
            done
            printf 'UNCOVERED %s: looked for %s\n' "${path}" "${looked}" >&2
          }

          # Print the module that covers one changed path and return success, or
          # print an UNCOVERED report on stderr and return failure.
          derive_suite_for_path() {
            local path="$1" rest dir sub name
            local -a candidates=()
            case "${path}" in
              src/plugins/*/*)
                rest=${path#src/plugins/}
                dir=${rest%%/*}
                sub=${rest#*/}
                sub=${sub%%/*}
                # The subdirectory is tried first, so
                # src/plugins/nat/nat64/nat64_db.c selects nat64 rather than the
                # package name nat, which has no module of its own. Only a
                # directory is a candidate: in src/plugins/gre/gre.c the second
                # path component is the file that changed.
                if [ -d "src/plugins/${dir}/${sub}" ]; then
                  candidates+=("${sub//-/_}")
                fi
                candidates+=("${dir//-/_}")
                for name in "${candidates[@]}"; do
                  if suite_module_exists "${name}"; then
                    printf '%s\n' "${name}"
                    return 0
                  fi
                done
                report_uncovered "${path}" "${candidates[@]}"
                return 1
                ;;
              src/vnet/*/*)
                rest=${path#src/vnet/}
                dir=${rest%%/*}
                name=$(suite_module_alias "${dir}")
                if [ -z "${name}" ]; then
                  name=${dir//-/_}
                fi
                if suite_module_exists "${name}"; then
                  printf '%s\n' "${name}"
                  return 0
                fi
                report_uncovered "${path}" "${name}"
                return 1
                ;;
            esac
            return 1
          }

          # Read the changed paths from stdin and print the TEST filter: a suite
          # whose own test module also changed goes first, alphabetical order
          # within each group, at most SUITE_CAP suites, ip4 when nothing
          # derives. A suite the cap drops is named on stderr rather than
          # vanishing.
          derive_test_suites() {
            local changed path name suite suites prioritized remaining selected dropped
            local -a paths=()
            changed=$(cat)
            mapfile -t paths <<< "${changed}"
            suites=""
            for path in "${paths[@]}"; do
              [ -n "${path}" ] || continue
              if name=$(derive_suite_for_path "${path}"); then
                suites="${suites} ${name}"
              fi
            done
            suites=$(printf '%s\n' "${suites}" | tr ' ' '\n' | sed '/^$/d' | sort -u)
            prioritized=""
            remaining=""
            for suite in ${suites}; do
              case $'\n'"${changed}"$'\n' in
                *$'\n'"test/test_${suite}.py"$'\n'*|*$'\n'"test/asf/test_${suite}.py"$'\n'*)
                  prioritized="${prioritized} ${suite}"
                  ;;
                *) remaining="${remaining} ${suite}" ;;
              esac
            done
            suites=$(printf '%s %s\n' "${prioritized}" "${remaining}" |
                     tr ' ' '\n' | sed '/^$/d')
            selected=$(printf '%s\n' "${suites}" | head -n "${SUITE_CAP}" | tr '\n' ' ')
            selected=${selected% }
            dropped=$(printf '%s\n' "${suites}" | sed "1,${SUITE_CAP}d" | tr '\n' ' ')
            if [ -n "${dropped% }" ]; then
              printf 'Not selected: the suite cap of %s drops %s\n' \
                "${SUITE_CAP}" "${dropped% }" >&2
            fi
            if [ -z "${selected}" ]; then
              printf 'No test derives from the changed paths; using the ip4 smoke suite\n' >&2
              selected="ip4"
            fi
            printf '%s\n' "${selected}"
          }
          HELPER

      # The derivation decides which suites the pull request runs, and a rule
      # that resolves to no module selects nothing instead of failing, so its
      # output is asserted on fixed paths before the build starts.
      - name: Self-check the test-suite derivation
        run: |
          set -eu
          . "${RUNNER_TEMP}/derive-suites.sh"
          failures=0
          expect_suite() {
            local path="$1" expected="$2" actual
            actual=$(derive_suite_for_path "${path}" 2>/dev/null || true)
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::${path}: expected suite '${expected}', derived '${actual}'"
              failures=$((failures + 1))
            fi
          }
          expect_uncovered() {
            local path="$1" looked="$2" module line
            module=$(derive_suite_for_path "${path}" 2>/dev/null || true)
            line=$(derive_suite_for_path "${path}" 2>&1 >/dev/null || true)
            if [ -n "${module}" ]; then
              echo "::error::${path}: expected no suite, derived '${module}'"
              failures=$((failures + 1))
            elif [ "${line}" != "UNCOVERED ${path}: looked for ${looked}" ]; then
              echo "::error::${path}: expected 'UNCOVERED ${path}: looked for ${looked}', got '${line}'"
              failures=$((failures + 1))
            fi
          }
          expect_suites() {
            local expected="$1" actual
            shift
            actual=$(printf '%s\n' "$@" | derive_test_suites 2>/dev/null)
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::derived suites '${actual}', expected '${expected}' from: $*"
              failures=$((failures + 1))
            fi
          }
          # One fixture per rule: the src/vnet alias table, the plain directory
          # rule, the plugin subdirectory candidate, the plugin package-name
          # fallback, and directories that have no module of their own.
          expect_suite src/vnet/ip-neighbor/ip6_neighbor.c neighbor
          expect_suite src/vnet/mfib/mfib_table.c ip_mcast
          expect_suite src/vnet/fib/fib_table.c fib
          expect_suite src/plugins/nat/nat64/nat64_db.c nat64
          # linux-cp has no test_lcp_node module, so this path can only resolve
          # through the package name.
          expect_suite src/plugins/linux-cp/lcp_node.c linux_cp
          expect_uncovered src/vnet/l2/l2_input.c "test/test_l2.py or test/asf/test_l2.py"
          expect_uncovered src/plugins/xdp/xdp_input.c "test/test_xdp.py or test/asf/test_xdp.py"
          # No package in this repository has both test_<pkg>.py and
          # test_<sub>.py, so the subdirectory-first order is unobservable in
          # the real tree. Assert it in a tree that has both.
          order_tree="${RUNNER_TEMP}/plugin-order"
          mkdir -p "${order_tree}/src/plugins/alpha/beta" "${order_tree}/test"
          : > "${order_tree}/test/test_alpha.py"
          : > "${order_tree}/test/test_beta.py"
          ordered=$(cd "${order_tree}" && derive_suite_for_path src/plugins/alpha/beta/x.c || true)
          if [ "${ordered}" != "beta" ]; then
            echo "::error::src/plugins/alpha/beta/x.c: expected the subdirectory suite 'beta', derived '${ordered}'"
            failures=$((failures + 1))
          fi
          # The aggregate filter: order, SUITE_CAP, the priority of a suite whose
          # own module changed, and the fallback.
          expect_suites "fib ip_mcast linux_cp" \
            src/vnet/fib/fib_table.c src/vnet/mfib/mfib_table.c \
            src/plugins/linux-cp/lcp_node.c
          expect_suites "neighbor fib ip_mcast" test/test_neighbor.py \
            src/vnet/ip-neighbor/ip6_neighbor.c src/vnet/fib/fib_table.c \
            src/vnet/mfib/mfib_table.c src/plugins/linux-cp/lcp_node.c
          expect_suites "ip4" src/vnet/l2/l2_input.c
          # SUITE_CAP is three, but a suite it leaves out is named instead of
          # vanishing: this is the changed set of pull request 48, where the
          # ip-neighbor suite does not fit in the cap.
          capped=$(printf '%s\n' src/vnet/fib/fib_table.c \
                   src/vnet/ip-neighbor/ip6_neighbor.c src/vnet/mfib/mfib_table.c \
                   src/plugins/linux-cp/lcp_node.c | derive_test_suites 2>&1 >/dev/null)
          if [ "${capped}" != "Not selected: the suite cap of 3 drops neighbor" ]; then
            echo "::error::the suite left out by the cap was not reported, got '${capped}'"
            failures=$((failures + 1))
          fi
          if [ "${failures}" -ne 0 ]; then
            echo "::error::${failures} derivation self-check assertion(s) failed"
            exit 1
          fi
          echo "The derivation self-check passed"

      # make install-dep installs $(DEB_DEPENDS), which is defined in the
      # Makefile, so key the apt archive cache on that file: the key moves when
      # the package list moves, and the run that first needs a new package is
      # the run that stores it. The install step rewrites the Makefile
      # afterwards, so the hash is taken into an output before that and both
      # cache steps read the same value.
      - name: Hash the dependency list
        id: deps
        run: |
          git config --global --add safe.directory "$PWD"
          echo "hash=$(git hash-object Makefile)" >> "$GITHUB_OUTPUT"

      - name: Restore apt archive cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debian13-${{ runner.arch }}-${{ github.job }}-${{ steps.deps.outputs.hash }}
          restore-keys: |
            apt-debian13-${{ runner.arch }}-${{ github.job }}-

      - name: Install VPP build dependencies
        run: |
          sed -i '/^\s*git config commit\.template/s/^\(\s*\)/\1-/' Makefile
          make UNATTENDED=yes install-dep

      # Saving is skipped when the exact key was restored: that entry already
      # holds what this run would store, and asking to save a key that exists
      # fails the step with "Unable to reserve cache".
      - name: Save apt archive cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debian13-${{ runner.arch }}-${{ github.job }}-${{ steps.deps.outputs.hash }}

      # Keyed by commit rather than by ref alone: a fixed key lets only the
      # first build of a ref store it, and every later build is asked to save a
      # key that already exists. A commit key gives each build its own entry,
      # and the prefix in restore-keys still lends a run the newest entry of
      # another commit on the same ref.
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: build-root/.ccache
          key: ccache-debug-debian13-${{ runner.arch }}-${{ matrix.variant }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-debug-debian13-${{ runner.arch }}-${{ matrix.variant }}-${{ github.ref_name }}-
            ccache-debug-debian13-${{ runner.arch }}-${{ matrix.variant }}-

      # src/scripts/version calls git describe without --tags, and origin
      # (sunoaki/vpp) has no v* tags, so the version is empty and the CMake
      # configure aborts with "string sub-command REPLACE requires at least
      # four arguments". Synthesise a version in the same format the DEB
      # workflow uses, whose ordering is already thought through, whenever no
      # tag is reachable.
      - name: Provide a version when origin has no tag
        run: |
          if ! git describe --tags --long --match 'v[0-9]*' 2>/dev/null; then
            echo "0.0.0-release+$(git log -1 --format=%ct).$(git rev-list --count HEAD)-g$(git rev-parse --short=7 HEAD)" \
              > src/scripts/.version
          fi

      # Apply the derivation written into ${RUNNER_TEMP}/derive-suites.sh above.
      # src/vnet/<dir> resolves through the alias table (ip-neighbor selects
      # neighbor, mfib selects ip_mcast) and otherwise to <dir>; a prefix match
      # is never used, because a directory such as ip would pull in every
      # ip4/ip6/ipip/ipsec suite. A src path that resolves to no test module is
      # logged as UNCOVERED with the module names that were tried, so a missing
      # mapping is visible in the log instead of shrinking the run silently.
      # src/vnet/tunnel/tunnel_dp.h is reported that way too: the ESP control
      # below selects ipsec_esp for it separately. Changes under src/vppinfra,
      # src/svm and src/vlib select nothing and use the ip4 fallback.
      - name: Derive a test filter from the changed paths
        id: tests
        env:
          # A workflow_dispatch run may name the suites itself.
          MANUAL_SUITES: ${{ inputs.suites }}
        run: |
          set -eu
          . "${RUNNER_TEMP}/derive-suites.sh"
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # A workflow_dispatch run has no pull request context; compare the
          # branch tip with its parent instead.
          if [ -z "${base}" ] || [ -z "${head}" ]; then
            base=$(git rev-parse HEAD^ 2>/dev/null || echo "")
            head=$(git rev-parse HEAD)
          fi
          changed=$(git diff --name-only "${base}...${head}" 2>/dev/null ||
                    git diff --name-only "${base}..${head}" 2>/dev/null || true)
          if [ -n "${MANUAL_SUITES}" ]; then
            suites=$(printf '%s' "${MANUAL_SUITES}" | tr -s '[:space:]' ' ' |
                     sed 's/^ *//; s/ *$//')
            echo "Using the suites input of this workflow_dispatch run: ${suites}"
          else
            suites=$(printf '%s\n' "${changed}" | derive_test_suites)
          fi
          echo "Running TEST suites: ${suites}"
          echo "suites=${suites}" >> "$GITHUB_OUTPUT"
          tunnel_regression=false
          case $'\n'"${changed}"$'\n' in
            *$'\n'src/vnet/tunnel/tunnel_dp.h$'\n'*)
              if [ -f test/test_ipsec_esp.py ]; then
                tunnel_regression=true
              fi
              ;;
          esac
          echo "tunnel_regression=${tunnel_regression}" >> "$GITHUB_OUTPUT"

      - name: Prepare exact ESP source variant and provenance
        if: needs.test-plan.outputs.tunnel_control == 'true'
        env:
          ESP_VARIANT: ${{ matrix.variant }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # A workflow_dispatch run has no pull request context; report the
          # branch tip and its parent instead of empty base and head values.
          if [ -z "${PR_BASE}" ] || [ -z "${PR_HEAD}" ]; then
            PR_BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "")
            PR_HEAD=$(git rev-parse HEAD)
            export PR_BASE PR_HEAD
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args]).decode().strip()

          def blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          output = Path(os.environ["RUNNER_TEMP"]) / "esp-evidence"
          output.mkdir()
          production = Path("src/vnet/tunnel/tunnel_dp.h")
          test = Path("test/test_ipsec_esp.py")
          before = production.read_bytes()
          test_before = test.read_bytes()
          expected_fixed = "468c628236393f184ab64736441fe1b7bbd40e36"
          expected_negative = "fd0d60c0a1a3021b22dad1d52fc3e54049bade46"
          expected_test = "093794c2074bbdf66f9350308439e833a03dccc6"
          report = {
              "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "variant": os.environ["ESP_VARIANT"], "base": os.environ["PR_BASE"],
              "head": os.environ["PR_HEAD"], "checkout": git("rev-parse", "HEAD"),
              "candidate_tree": git("rev-parse", "HEAD^{tree}"),
              "reviewed_product": "815eaa339772c4c715ac0890fe2c2b136f694fe9",
              "expected_fixed": expected_fixed, "expected_negative": expected_negative,
              "expected_test": expected_test, "before_header": blob(before),
              "before_test": blob(test_before), "replacement_count": 0,
          }
          (output / "provenance.json").write_text(json.dumps(report, indent=2) + "\n")
          assert blob(before) == expected_fixed, "candidate header differs from reviewed M40"
          assert blob(test_before) == expected_test, "candidate test differs from reviewed M40"
          assert git("diff", "--name-only", "HEAD", "--", str(production), str(test)) == ""
          old = (b'      u16 old_flags = outer->flags_and_fragment_offset;\n'
                 b'\n'
                 b'      ip4_header_set_df (outer);\n'
                 b'\n'
                 b'      sum = ip_csum_update (outer->checksum, old_flags, outer->flags_and_fragment_offset,\n'
                 b'\t\t\t    ip4_header_t, flags_and_fragment_offset);\n')
          new = (b'      u16 tos = outer->flags_and_fragment_offset;\n'
                 b'\n'
                 b'      ip4_header_set_df (outer);\n'
                 b'\n'
                 b'      sum =\n'
                 b'\tip_csum_update (outer->checksum, tos, outer->tos, ip4_header_t,\n'
                 b'\t\t\tflags_and_fragment_offset);\n')
          if os.environ["ESP_VARIANT"] == "original-df":
              assert before.count(old) == 1 and before.count(new) == 0
              negative = before.replace(old, new, 1)
              assert blob(negative) == expected_negative
              assert negative.replace(new, old, 1) == before
              production.write_bytes(negative)
              report["replacement_count"] = 1
          assert test.read_bytes() == test_before
          report["built_header"] = blob(production.read_bytes())
          report["built_test"] = blob(test.read_bytes())
          index = output / "source.index"
          env = dict(os.environ, GIT_INDEX_FILE=str(index))
          subprocess.run(["git", "read-tree", "HEAD"], env=env, check=True)
          for path in git("diff", "--name-only", "HEAD").splitlines():
              subprocess.run(["git", "add", "--", path], env=env, check=True)
          version = Path("src/scripts/.version")
          assert not version.is_symlink(), "unsafe build version input"
          if version.exists():
              assert version.is_file() and 0 < version.stat().st_size <= 4096, "invalid build version input"
              version_bytes = version.read_bytes()
              (output / "build-version.raw").write_bytes(version_bytes)
              report["build_version"] = {"source": str(version), "blob": blob(version_bytes),
                                         "sha256": hashlib.sha256(version_bytes).hexdigest()}
              subprocess.run(["git", "add", "-f", "--", str(version)], env=env, check=True)
          else:
              version_bytes = subprocess.check_output(["git", "describe", "--long", "--match", "v*"])
              assert version_bytes.strip(), "missing tag-derived build version"
              (output / "build-version.raw").write_bytes(version_bytes)
              report["build_version"] = {"source": "git describe --long --match v*",
                                         "blob": blob(version_bytes),
                                         "sha256": hashlib.sha256(version_bytes).hexdigest()}
          report["built_source_tree"] = subprocess.check_output(["git", "write-tree"], env=env).decode().strip()
          index.unlink()
          manifest = subprocess.check_output(["git", "ls-tree", "-r", "-z", report["built_source_tree"]])
          (output / "built-source-manifest.txt").write_bytes(manifest)
          report["built_manifest_sha256"] = hashlib.sha256(manifest).hexdigest()
          (output / "provenance.json").write_text(json.dumps(report, indent=2) + "\n")
          subprocess.run(["git", "diff", "--check"], check=True)
          PY

      - name: Build VPP debug
        id: build
        run: |
          git config --global --add safe.directory "$PWD"
          export VPP_EXTRA_CMAKE_ARGS="\
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          ccache -z
          make UNATTENDED=yes build
          ccache -s

      - name: Save ccache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-root/.ccache
          key: ccache-debug-debian13-${{ runner.arch }}-${{ matrix.variant }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Remount /dev/shm for the test harness
        uses: ./.github/actions/vpp-docker-runtime-setup
        with:
          WORKSPACE: ${{ github.workspace }}
          SHM_SIZE: 2G
          LOG_DIR: ${{ github.workspace }}/build-root/test-logs

      - name: Check namespace support for linux_cp
        if: contains(format(' {0} ', steps.tests.outputs.suites), ' linux_cp ')
        run: |
          set -Eeuo pipefail
          namespace="vpp-ci-netns-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            result=$?
            trap - EXIT
            if [ -e "/run/netns/${namespace}" ]; then
              ip netns del "${namespace}" || result=1
            fi
            exit "${result}"
          }
          trap cleanup EXIT
          trap 'echo "::error::Namespace preflight: ${BASH_COMMAND}" >&2' ERR
          command -v ip
          id
          # Report the effective capabilities and active security filters.
          sed -n '/^Cap/p; /^NoNewPrivs:/p; /^Seccomp/p' /proc/self/status
          if [ -r /proc/self/attr/current ]; then
            cat /proc/self/attr/current || true
          fi
          set -x
          ip netns add "${namespace}"
          ip netns exec "${namespace}" ip link set lo up
          ip netns exec "${namespace}" ip link show lo
          # VPP's TAP backend opens both devices when it creates an LCP pair.
          mkdir -p /dev/net
          if [ ! -e /dev/net/tun ]; then
            mknod /dev/net/tun c 10 200
          fi
          if [ ! -e /dev/vhost-net ]; then
            mknod /dev/vhost-net c 10 238
          fi
          for device in /dev/net/tun /dev/vhost-net; do
            test -c "${device}"
            (: <> "${device}")
          done
          ip netns exec "${namespace}" ip tuntap add dev vpp-ci-tap mode tap
          ip netns exec "${namespace}" ip link del vpp-ci-tap

      - name: Run the original DF checksum control
        id: negative
        if: matrix.variant == 'original-df'
        run: |
          set -eu
          evidence="${RUNNER_TEMP}/esp-evidence"
          mkdir "${RUNNER_TEMP}/esp-observer"
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = '''import json
          import os
          import traceback
          import unittest

          original = unittest.TestResult.addSubTest
          def record(self, test, subtest, error):
              if test.id() == "test_ipsec_esp.TestIpsecEspTun.test_tun_df44":
                  event = {"test": test.id(), "params": dict(subtest.params),
                           "error": None if error is None else error[0].__name__,
                           "trace": "" if error is None else "".join(traceback.format_exception(*error))}
                  path = os.path.join(os.environ["ESP_EVIDENCE"], "subtests-" + str(os.getpid()) + ".jsonl")
                  data = (json.dumps(event) + "\\n").encode()
                  if os.path.exists(path) and os.path.getsize(path) + len(data) > 1048576:
                      raise RuntimeError("ESP subtest evidence exceeds 1 MiB")
                  with open(path, "ab") as output:
                      output.write(data)
              return original(self, test, subtest, error)
          unittest.TestResult.addSubTest = record
          '''
          (Path(os.environ["RUNNER_TEMP"]) / "esp-observer/sitecustomize.py").write_text(source)
          PY
          export ESP_EVIDENCE="${evidence}"
          export PYTHONPATH="${RUNNER_TEMP}/esp-observer${PYTHONPATH:+:${PYTHONPATH}}"
          rm -f /tmp/vpp-unittest-TestIpsecEspTun/log.txt
          set +e
          make UNATTENDED=yes TEST_JOBS=auto RETRIES=0 \
            TEST=ipsec_esp.TestIpsecEspTun.test_tun_df44 test-debug 2>&1 |
            (ulimit -f 32768; tee "${evidence}/command.log")
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "${evidence}/raw-returncode.txt"
          printf '%s\n' "${statuses[1]}" > "${evidence}/capture-returncode.txt"
          printf '%s\n' 'make UNATTENDED=yes TEST_JOBS=auto RETRIES=0 TEST=ipsec_esp.TestIpsecEspTun.test_tun_df44 test-debug' > "${evidence}/command.txt"
          test "${statuses[1]}" = 0

      - name: Run the Python functional tests
        id: positive
        if: matrix.variant == 'fixed'
        env:
          SUITES: ${{ steps.tests.outputs.suites }}
        run: |
          git config --global --add safe.directory "$PWD"
          set -eu
          read -ra suites <<< "${SUITES}"
          if [ '${{ steps.tests.outputs.tunnel_regression }}' = true ]; then
            case " ${suites[*]} " in
              *' ipsec_esp '*) ;;
              *) suites+=(ipsec_esp) ;;
            esac
          fi
          for suite in "${suites[@]}"; do
            echo "Running TEST=${suite}"
            if [ "${suite}" = linux_cp ]; then
              recovery_log=/tmp/vpp-unittest-TestLinuxCPNetlinkRecovery/log.txt
              rm -f "${recovery_log}"
            fi
            if [ "${suite}" = ipsec_esp ] && [ '${{ needs.test-plan.outputs.tunnel_control }}' = true ]; then
              rm -f /tmp/vpp-unittest-TestIpsecEspTun/log.txt
              evidence="${RUNNER_TEMP}/esp-evidence"
              set +e
              make UNATTENDED=yes TEST_JOBS=auto RETRIES=2 TEST="${suite}" test-debug 2>&1 |
                (ulimit -f 32768; tee "${evidence}/command.log")
              statuses=("${PIPESTATUS[@]}")
              set -e
              printf '%s\n' "${statuses[0]}" > "${evidence}/raw-returncode.txt"
              printf '%s\n' "${statuses[1]}" > "${evidence}/capture-returncode.txt"
              printf '%s\n' 'make UNATTENDED=yes TEST_JOBS=auto RETRIES=2 TEST=ipsec_esp test-debug' > "${evidence}/command.txt"
              python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path("/tmp/vpp-unittest-TestIpsecEspTun/log.txt")
          if not source.is_file() or source.is_symlink() or source.stat().st_size > 8 * 1024 * 1024:
              raise SystemExit("Missing, unsafe or oversized ESP named log")
          (Path(os.environ["RUNNER_TEMP"]) / "esp-evidence/named-test.log").write_bytes(source.read_bytes())
          PY
              test "${statuses[1]}" = 0
              test "${statuses[0]}" = 0
            else
              make UNATTENDED=yes TEST_JOBS=auto RETRIES=2 TEST="${suite}" test-debug
            fi
            if [ "${suite}" = linux_cp ]; then
              python3 - "${recovery_log}" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file():
              sys.exit(f"::error::Missing recovery test results: {path}")
          results = {}
          # VppTestResult.log_result records the callback and exact test name.
          pattern = (r" --- (add\w+)\(\) TestLinuxCPNetlinkRecovery\."
                     r"(\w+)\(")
          for callback, method in re.findall(pattern, path.read_text()):
              results.setdefault(method, []).append(callback)
          for method in ("test_netlink_poll_error_recovery",
                         "test_netlink_poll_error_invalid_fd"):
              callbacks = results.get(method, [])
              if callbacks != ["addSuccess"]:
                  sys.exit(f"::error::{method}: expected addSuccess, "
                           f"got {callbacks}; see {path}")
              print(f"Verified {method}: addSuccess")
          PY
            fi
          done

      - name: Verify complete ESP evidence
        if: always() && needs.test-plan.outputs.tunnel_control == 'true'
        env:
          ESP_VARIANT: ${{ matrix.variant }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ matrix.variant == 'fixed' && steps.positive.outcome || steps.negative.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          output = Path(os.environ["RUNNER_TEMP"]) / "esp-evidence"
          output.mkdir(exist_ok=True)
          result = {"accepted": False, "build": os.environ["BUILD_OUTCOME"],
                    "test_step": os.environ["TEST_OUTCOME"]}
          try:
              if not (output / "named-test.log").exists():
                  source = Path("/tmp/vpp-unittest-TestIpsecEspTun/log.txt")
                  assert source.is_file() and not source.is_symlink(), "missing named ESP log"
                  assert source.stat().st_size <= 8 * 1024 * 1024, "named ESP log exceeds 8 MiB"
                  (output / "named-test.log").write_bytes(source.read_bytes())
              provenance = json.loads((output / "provenance.json").read_text())
              manifest = (output / "built-source-manifest.txt").read_bytes()
              assert hashlib.sha256(manifest).hexdigest() == provenance["built_manifest_sha256"]
              assert manifest == subprocess.check_output(["git", "ls-tree", "-r", "-z", provenance["built_source_tree"]])
              assert subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip() == provenance["checkout"]
              version_bytes = (output / "build-version.raw").read_bytes()
              version_info = provenance["build_version"]
              assert 0 < len(version_bytes) <= 4096, "missing or oversized build version evidence"
              version_blob = hashlib.sha1(b"blob " + str(len(version_bytes)).encode() + b"\0" + version_bytes).hexdigest()
              assert version_blob == version_info["blob"]
              assert hashlib.sha256(version_bytes).hexdigest() == version_info["sha256"]
              version = Path("src/scripts/.version")
              assert not version.is_symlink(), "unsafe post-build version input"
              if version_info["source"] == str(version):
                  assert version.is_file() and version.read_bytes() == version_bytes, "build version drift"
                  assert subprocess.check_output(["git", "show", provenance["built_source_tree"] + ":" + str(version)]) == version_bytes
              else:
                  assert version_info["source"] == "git describe --long --match v*" and not version.exists()
                  assert subprocess.check_output(["git", "describe", "--long", "--match", "v*"]) == version_bytes
              for key, path in (("built_header", "src/vnet/tunnel/tunnel_dp.h"),
                                ("built_test", "test/test_ipsec_esp.py")):
                  data = Path(path).read_bytes()
                  actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
                  assert actual == provenance[key], "post-build source drift: " + path
              raw = (output / "command.log").read_text()
              named = (output / "named-test.log").read_text()
              rc = int((output / "raw-returncode.txt").read_text())
              result["raw_returncode"] = rc
              assert int((output / "capture-returncode.txt").read_text()) == 0
              assert os.environ["BUILD_OUTCOME"] == "success", "build did not succeed"
              assert os.environ["TEST_OUTCOME"] == "success", "command/capture step failed"
              assert (output / "command.txt").stat().st_size > 0 and raw and named
              assert (output / "command.log").stat().st_size <= 32 * 1024 * 1024
              callbacks = re.findall(r" --- (add\w+)\(\) TestIpsecEspTun\.test_tun_df44\(", named)
              if os.environ["ESP_VARIANT"] == "fixed":
                  assert rc == 0 and callbacks == ["addSuccess"], "missing exact positive success"
                  assert provenance["built_header"] == provenance["expected_fixed"]
              else:
                  assert 0 < rc < 128 and callbacks == [], "unexpected return code or method callback"
                  assert provenance["replacement_count"] == 1
                  assert provenance["built_header"] == provenance["expected_negative"]
                  events = []
                  for path in sorted(output.glob("subtests-*.jsonl")):
                      assert path.stat().st_size <= 1024 * 1024
                      events.extend(json.loads(line) for line in path.read_text().splitlines())
                  expected = {(flag, tos, df, size) for flag, tos in ((1, 0), (1, 171), (13, 171), (0, 171))
                              for df in (0, 1) for size in (0, 1, 54, 511)}
                  actual = [(e["params"]["tun_flags"], e["params"]["inner_tos"],
                             e["params"]["inner_df"], e["params"]["payload_size"]) for e in events]
                  assert len(events) == 32 and set(actual) == expected, "incomplete subtest matrix"
                  failures = [event for event in events if event["error"] is not None]
                  assert failures and actual[:4] == [(1, 0, 0, size) for size in (0, 1, 54, 511)]
                  assert all(event["error"] is None for event in events[:4]), "DF0 controls failed"
                  first = failures[0]
                  assert first["params"] == {"tun_flags": 1, "inner_tos": 0, "inner_df": 1, "payload_size": 0}
                  for event in events:
                      assert event["test"] == "test_ipsec_esp.TestIpsecEspTun.test_tun_df44"
                  for event in failures:
                      trace = event["trace"]
                      assert event["error"] == "AssertionError"
                      assert 'test_ipsec_esp.py", line 604, in test_tun_df44' in trace
                      assert 'test_ipsec_esp.py", line 565, in verify_encrypted' in trace
                      assert "self.assertEqual(checksum(header[:header_len]), 0)" in trace
                      assert re.search(r"AssertionError: [1-9][0-9]* != 0", trace)
                  assert "AssertionError: 49151 != 0" in first["trace"]
                  assert "FAIL:" in raw and "AssertionError: 49151 != 0" in raw
                  assert not re.search(r"^ERROR:|CoreDump|TimeoutExpired", raw, re.MULTILINE)
                  (output / "checksum-witness.txt").write_text(first["trace"])
                  result["subtests"] = len(events)
                  result["checksum_failures"] = len(failures)
              result["accepted"] = True
          except Exception as error:
              result["error"] = str(error)
              raise
          finally:
              (output / "result.json").write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Upload ESP evidence
        if: always() && needs.test-plan.outputs.tunnel_control == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esp-evidence-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/esp-evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Collect failed test diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import stat

          output = Path(os.environ["RUNNER_TEMP"]) / "vpp-test-diagnostics"
          output.mkdir(parents=True, exist_ok=True)
          # Retry directories are real siblings of the current test directory.
          # Do not rely on upload-artifact following the -FAILED symlinks.
          failed = Path("/tmp/vpp-failed-unittests")
          test_dirs = sorted(Path("/tmp").glob("vpp-unittest-*"))
          failed_names = set()
          report = ["Limits: 256 MiB total, 32 MiB per file, 2000 files.",
                    "Oversized text logs retain their tail; oversized binary traces/pcaps are skipped.",
                    "Collect .txt/.log/.pcap/.pcapng and api_post_mortem.<pid>; exclude cores/sockets.",
                    "Symlinks are recorded, never traversed.",
                    "Staged filenames use unique numeric IDs with safe extensions; this report maps back to originals.",
                    "Copied paths below map original -> staged, relative to this report."]
          if failed.is_dir() and not failed.is_symlink():
              for link in sorted(failed.iterdir()):
                  if link.is_symlink():
                      target = os.readlink(link)
                      report.append(f"LINK {link} -> {target}")
                      failed_names.add(Path(target).name)
          test_dirs.sort(key=lambda path: (path.name not in failed_names, path.name))
          roots = [failed, *test_dirs, Path("build-root/test-logs").absolute()]
          candidates = []
          for root in roots:
              if root.is_symlink() or not root.is_dir():
                  report.append(f"MISSING OR UNSAFE directory: {root}")
                  continue
              for directory, subdirs, names in os.walk(root, followlinks=False):
                  subdirs[:] = sorted(name for name in subdirs
                                      if not (Path(directory) / name).is_symlink())
                  for name in sorted(names):
                      source = Path(directory) / name
                      post_mortem = re.fullmatch(r"api_post_mortem\.[0-9]+", name) is not None
                      if not post_mortem and source.suffix not in (".txt", ".log", ".pcap", ".pcapng"):
                          continue
                      if not stat.S_ISREG(source.lstat().st_mode):
                          continue
                      # Preserve logs and API traces before packet captures.
                      priority = (0 if name in ("log.txt", "vpp_stdout.txt", "vpp_stderr.txt",
                                               "failed_tests.txt") else
                                  2 if source.suffix in (".pcap", ".pcapng") else 1)
                      binary = (post_mortem or name.startswith("vpp_api_trace") or
                                source.suffix in (".pcap", ".pcapng"))
                      candidates.append((priority, source, binary))
          remaining = 256 * 1024 * 1024
          file_limit = 32 * 1024 * 1024
          count = 0
          for _, source, binary in sorted(candidates, key=lambda item: item[0]):
              size = source.stat().st_size
              length = min(size, file_limit)
              reason = ("32 MiB binary file limit" if binary and size > file_limit else
                        "2000-file limit" if count >= 2000 else
                        "256 MiB total limit" if length > remaining else "")
              if reason:
                  report.append(f"SKIPPED ({reason}): {source} ({size} bytes)")
                  continue
              suffix = source.suffix if source.suffix in (".txt", ".log", ".pcap", ".pcapng") else ".bin"
              staged = Path(f"{count + 1:04d}{suffix}")
              destination = output / staged
              with source.open("rb") as reader, destination.open("wb") as writer:
                  if size > length:
                      reader.seek(size - length)
                  writer.write(reader.read(length))
              remaining -= length
              count += 1
              status = "TAIL" if size > length else "COPIED"
              report.append(f"{status}: {str(source)!r} -> {str(staged)!r} ({length}/{size} bytes)")
          if not count:
              print("::warning::No test diagnostic files found; uploading collection report only")
          report.append(f"Collected {count} files, {256 * 1024 * 1024 - remaining} bytes.")
          (output / "collection-report.txt").write_text("\n".join(report) + "\n")
          print(report[-1])
          PY

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vpp-test-diagnostics-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vpp-test-diagnostics/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6
