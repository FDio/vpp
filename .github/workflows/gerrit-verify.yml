name: gerrit-verify

on:
  workflow_dispatch:
    inputs:
      FDIO_NAMESPACE:
        description: "Executor Namespace (prod|sandbox)"
        required: false
        type: choice
        options:
          - sandbox
          - prod
        default: prod
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: true
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read   # Needed to read local actions

concurrency:
  group: ${{ github.workflow }}-${{ inputs.GERRIT_PROJECT }}-${{ inputs.GERRIT_BRANCH }}-${{ inputs.GERRIT_CHANGE_NUMBER }}-${{ inputs.FDIO_NAMESPACE }}
  cancel-in-progress: true

jobs:
  rate-limit-check:
    name: Rate Limit Check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read   # needed for gh run list
      contents: read  # default, made explicit
    steps:
      - name: Enforce uploader rate limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GERRIT_SSH_PRIVKEY: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          GERRIT_SSH_USER: ${{ vars.GERRIT_SSH_USER }}
          GERRIT_HOST: ${{ vars.GERRIT_SERVER }}
          GERRIT_SSH_PORT: "29418"
          GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          WORKFLOW: gerrit-verify.yml
          RATE_LIMIT_5MIN_COUNT: "3"
          RATE_LIMIT_5MIN_WINDOW: "300"
          RATE_LIMIT_1H_COUNT: "6"
          RATE_LIMIT_1H_WINDOW: "3600"
          RATE_LIMIT_LOOKBACK_MINUTES: "70"
          RATE_LIMIT_MAX_DELAY: "30"
        run: |
          set -euo pipefail

          # Setup SSH key from secret (never echo it)
          mkdir -p ~/.ssh
          printf '%s\n' "$GERRIT_SSH_PRIVKEY" > ~/.ssh/gerrit_key
          chmod 600 ~/.ssh/gerrit_key

          # Query Gerrit with exponential backoff
          # Result is returned only via stdout for capture; all status goes to stderr
          gerrit_query() {
            local change_number="$1"
            local max_seconds=300
            local delay=2
            local elapsed=0
            local attempt=1

            while [ "$elapsed" -lt "$max_seconds" ]; do
              echo "Gerrit query attempt $attempt for change $change_number (elapsed ${elapsed}s)..." >&2

              local result
              if result=$(ssh -i ~/.ssh/gerrit_key \
                              -o StrictHostKeyChecking=no \
                              -o UserKnownHostsFile=/dev/null \
                              -o ConnectTimeout=10 \
                              -p "$GERRIT_SSH_PORT" \
                              "${GERRIT_SSH_USER}@${GERRIT_HOST}" \
                              gerrit query --format=JSON --current-patch-set "$change_number" \
                            2>/dev/null \
                            | head -n 1 \
                            | jq -r '.currentPatchSet.uploader.username // .owner.username // empty'); then
                if [ -n "$result" ]; then
                  echo "$result"
                  return 0
                fi
              fi

              # Exponential backoff, capped so we don't exceed remaining time
              local sleep_for=$delay
              local remaining=$((max_seconds - elapsed))
              if [ "$sleep_for" -gt "$remaining" ]; then
                sleep_for=$remaining
              fi
              if [ "$sleep_for" -le 0 ]; then
                break
              fi

              echo "Query failed or empty, retrying in ${sleep_for}s..." >&2
              sleep "$sleep_for"
              elapsed=$((elapsed + sleep_for))
              delay=$((delay * 2))
              if [ "$delay" -gt "$RATE_LIMIT_MAX_DELAY" ]; then
                delay=$RATE_LIMIT_MAX_DELAY
              fi
              attempt=$((attempt + 1))
            done

            echo "Gerrit query failed after ${elapsed}s" >&2
            return 1
          }

          # Current uploader ? failure to resolve is a hard error
          if ! UPLOADER=$(gerrit_query "$GERRIT_CHANGE_NUMBER"); then
            echo "::error::Could not determine uploader for change $GERRIT_CHANGE_NUMBER after retries"
            exit 1
          fi

          # Recent runs
          RUNS=$(gh run list \
            --workflow "$WORKFLOW" \
            --limit 100 \
            --json databaseId,createdAt,displayTitle \
            --created ">$(date -u -d "${RATE_LIMIT_LOOKBACK_MINUTES} minutes ago" +%Y-%m-%dT%H:%M:%SZ)")

          declare -A OWNER_CACHE
          OWNER_CACHE["$GERRIT_CHANGE_NUMBER"]="$UPLOADER"

          NOW=$(date -u +%s)
          FIVE_MIN=$((NOW - RATE_LIMIT_5MIN_WINDOW))
          ONE_HOUR=$((NOW - RATE_LIMIT_1H_WINDOW))
          COUNT_5MIN=0
          COUNT_1H=0

          while IFS= read -r run; do
            created=$(echo "$run" | jq -r '.createdAt')
            created_epoch=$(date -u -d "$created" +%s 2>/dev/null || echo 0)
            title=$(echo "$run" | jq -r '.displayTitle // ""')

            # Extract change number from "gerrit-verify 12345/3"
            run_change=$(echo "$title" | grep -oE '[0-9]+' | head -1 || true)
            [ -z "$run_change" ] && continue

            if [ -z "${OWNER_CACHE[$run_change]:-}" ]; then
              if ! owner=$(gerrit_query "$run_change"); then
                echo "::error::Could not determine uploader for change $run_change after retries"
                exit 1
              fi
              OWNER_CACHE["$run_change"]="$owner"
            fi

            if [ "${OWNER_CACHE[$run_change]}" = "$UPLOADER" ]; then
              if [ "$created_epoch" -ge "$ONE_HOUR" ]; then
                COUNT_1H=$((COUNT_1H + 1))
                if [ "$created_epoch" -ge "$FIVE_MIN" ]; then
                  COUNT_5MIN=$((COUNT_5MIN + 1))
                fi
              fi
            fi
          done < <(echo "$RUNS" | jq -c '.[]')

          echo "Runs by uploader ? 5min: $COUNT_5MIN (limit: ${RATE_LIMIT_5MIN_COUNT}) , 1h: $COUNT_1H (limit: ${RATE_LIMIT_1H_COUNT})"

          if [ "$COUNT_5MIN" -ge "$RATE_LIMIT_5MIN_COUNT" ] || [ "$COUNT_1H" -ge "$RATE_LIMIT_1H_COUNT" ]; then
            echo "::error::Rate limit exceeded for uploader (${COUNT_5MIN}/${RATE_LIMIT_5MIN_COUNT} in 5 min, ${COUNT_1H}/${RATE_LIMIT_1H_COUNT} in 1 h)"
            exit 1
          fi

  start-verify:
    name: Start Verify
    needs:
      - rate-limit-check
    runs-on: ubuntu-latest
    environment: production
    outputs:
      log_prefix: ${{ steps.start-time.outputs.log_prefix }}

    steps:
      - name: Start Time
        id: start-time
        env:
          GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
          GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
        run: |
          set -euxo pipefail
          timestamp=$(date -u +%Y_%m_%d_%H%M%S_UTC)
          branch="$GERRIT_BRANCH"
          branch=${branch/\//-}
          log_prefix="gha-vpp-gerrit-patchset/verify-${branch}-${timestamp}-gerrit-$GERRIT_CHANGE_NUMBER-$GERRIT_PATCHSET_NUMBER"
          echo "log_prefix=$log_prefix" >> "$GITHUB_OUTPUT"
          echo "Gerrit Change: $GERRIT_CHANGE_URL"

      - name: Job Details
        env:
          GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
          GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
          GERRIT_CHANGE_ID: ${{ inputs.GERRIT_CHANGE_ID }}
          GERRIT_PATCHSET_REVISION: ${{ inputs.GERRIT_PATCHSET_REVISION }}
          GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
          GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE }}
          FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
        run: |
          {
            echo "### Gerrit Verify Handler"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Gerrit change | $GERRIT_CHANGE_URL/$GERRIT_PATCHSET_NUMBER |"
            echo "| Branch | $GERRIT_BRANCH |"
            echo "| Gerrit Change ID | $GERRIT_CHANGE_ID |"
            echo "| Patchset Revision | $GERRIT_PATCHSET_REVISION |"
            echo "| Refspec | $GERRIT_REFSPEC |"
            echo "| Gerrit Event | $GERRIT_EVENT_TYPE |"
            echo "| Namespace | $FDIO_NAMESPACE |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear Gerrit vote
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a5de1d5bf17c2603ae81544dc2a455017b454ec8 # 1.1.1
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_REQUIRED_USER }}
          key: ${{ secrets.GERRIT_SSH_REQUIRED_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
          comment-only: true

  verify-checkstyle:
    name: Checkstyle
    needs:
      - rate-limit-check
      - start-verify
    uses: fdio/vpp/.github/workflows/vpp-verify-checkstyle.yml@25e2784d997d02529c84f308aadd62c98ed65ff0
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_ID: ${{ inputs.GERRIT_CHANGE_ID }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PATCHSET_REVISION: ${{ inputs.GERRIT_PATCHSET_REVISION }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  verify-maketest:
    name: Maketest
    needs:
      - rate-limit-check
      - start-verify
      - verify-checkstyle
    if: ${{ needs.verify-checkstyle.result == 'success' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-maketest.yml@25e2784d997d02529c84f308aadd62c98ed65ff0
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  verify-gcc:
    name: GCC
    needs:
      - rate-limit-check
      - start-verify
      - verify-checkstyle
    if: ${{ needs.verify-checkstyle.result == 'success' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-gcc.yml@25e2784d997d02529c84f308aadd62c98ed65ff0
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_ID: ${{ inputs.GERRIT_CHANGE_ID }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PATCHSET_REVISION: ${{ inputs.GERRIT_PATCHSET_REVISION }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  verify-csit-api:
    name: CSIT API
    needs:
      - rate-limit-check
      - start-verify
      - verify-checkstyle
    if: ${{ needs.verify-checkstyle.result == 'success' }}
    uses: fdio/vpp/.github/workflows/vpp-csit-verify-api.yml@25e2784d997d02529c84f308aadd62c98ed65ff0
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  verify-arm-drivers:
    name: ARM Drivers
    needs:
      - rate-limit-check
      - start-verify
      - verify-checkstyle
    if: ${{ needs.verify-checkstyle.result == 'success' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-arm-drivers.yml@25e2784d997d02529c84f308aadd62c98ed65ff0
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  verify-hst:
    name: HST
    needs:
      - rate-limit-check
      - start-verify
      - verify-checkstyle
    if: ${{ needs.verify-checkstyle.result == 'success' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-hst.yml@25e2784d997d02529c84f308aadd62c98ed65ff0
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  detect-docs-changes:
    name: Detect Docs Changes
    needs:
      - rate-limit-check
      - start-verify
      - verify-checkstyle
    runs-on:
      # zizmor: ignore[self-hosted-runner]
      - self-hosted
      - nomad
      - fdio:arch=x86_64
      - fdio:class=builder
      - fdio:namespace=${{ inputs.FDIO_NAMESPACE || 'prod' }}
      - fdio:os=ubuntu2404
      - fdio:size=csit
      - fdio:workflow=${{ github.run_id }}
    outputs:
      docs_changed: ${{ steps.docs-changed.outputs.docs_changed }}
    env:
      WORKSPACE: /scratch/docker-build/vpp
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      TUI_LINE: "*******************************************************************"
    steps:
      - name: Setup Environment
        id: setup-executor-env
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: fdio/.github/.github/actions/setup-executor-env@b728d1589228e2891a4241a1bba362d76895c225

      - name: Checkout VPP Gerrit Change
        id: checkout-vpp
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: fdio/vpp/.github/actions/vpp-checkout-gerrit-change@27fc2aa27f57c8f7055e8f1b6e5a9f41b0315873
        with:
          WORKSPACE: ${{ env.WORKSPACE }}
          GERRIT_BRANCH: ${{ env.GERRIT_BRANCH }}
          GERRIT_REFSPEC: ${{ env.GERRIT_REFSPEC }}
          TUI_LINE: ${{ env.TUI_LINE }}

      - name: Detect docs changes
        id: docs-changed
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout-vpp.outcome }}
        run: |
          set -euxo pipefail

          docs_changed="true"
          if [[ "$CHECKOUT_OUTCOME" == "success" ]]; then
            cd "$WORKSPACE"
            if git diff-tree --no-commit-id --name-only -r --root HEAD | grep -Eq '(^docs/|\.rst$)'; then
              docs_changed="true"
            else
              docs_changed="false"
            fi
          else
            echo "warn: unable to checkout '${GERRIT_REFSPEC}'; defaulting docs_changed=true" >&2
          fi

          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"

  verify-docs:
    name: Docs
    needs:
      - rate-limit-check
      - start-verify
      - detect-docs-changes
      - verify-checkstyle
    if: ${{ needs.verify-checkstyle.result == 'success' && needs.detect-docs-changes.outputs.docs_changed == 'true' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-docs.yml@25e2784d997d02529c84f308aadd62c98ed65ff0
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets:
      AWS_DOCS_7DAY_ACCESS_KEY_ID: ${{ secrets.AWS_DOCS_7DAY_ACCESS_KEY_ID }}
      AWS_DOCS_7DAY_SECRET_ACCESS_KEY: ${{ secrets.AWS_DOCS_7DAY_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  final-vote:
    name: Vote
    if: ${{ always() }}
    needs:
      - rate-limit-check
      - start-verify
      - detect-docs-changes
      - verify-checkstyle
      - verify-maketest
      - verify-gcc
      - verify-docs
      - verify-csit-api
      - verify-arm-drivers
      - verify-hst
    runs-on: ubuntu-latest
    environment: production
    env:
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
    steps:
      - name: Collect workflow results
        id: overall
        env:
          DOCS_CHANGED: ${{ needs.detect-docs-changes.outputs.docs_changed }}
          VERIFY_DOCS_RESULT: ${{ needs.verify-docs.result }}
          START_VERIFY_RESULT: ${{ needs.start-verify.result }}
          VERIFY_CHECKSTYLE_RESULT: ${{ needs.verify-checkstyle.result }}
          VERIFY_MAKETEST_RESULT: ${{ needs.verify-maketest.result }}
          VERIFY_GCC_RESULT: ${{ needs.verify-gcc.result }}
          VERIFY_CSIT_API_RESULT: ${{ needs.verify-csit-api.result }}
          VERIFY_ARM_DRIVERS_RESULT: ${{ needs.verify-arm-drivers.result }}
          VERIFY_HST_RESULT: ${{ needs.verify-hst.result }}
        run: |
          set -euxo pipefail
          docs_ok="true"
          if [[ "$DOCS_CHANGED" == "true" ]]; then
            [[ "$VERIFY_DOCS_RESULT" == "success" ]] || docs_ok="false"
          fi

          if [[ "$START_VERIFY_RESULT" == "success" && \
                "$VERIFY_CHECKSTYLE_RESULT" == "success" && \
                "$VERIFY_MAKETEST_RESULT" == "success" && \
                "$VERIFY_GCC_RESULT" == "success" && \
                "$docs_ok" == "true" && \
                "$VERIFY_CSIT_API_RESULT" == "success" && \
                "$VERIFY_ARM_DRIVERS_RESULT" == "success" && \
                "$VERIFY_HST_RESULT" == "success" ]]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerrit Vote
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a5de1d5bf17c2603ae81544dc2a455017b454ec8 # 1.1.1
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ env.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ env.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ steps.overall.outputs.result }}
          comment-only: false # Vote on gerrit
