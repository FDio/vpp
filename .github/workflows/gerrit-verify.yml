name: gerrit-verify

on:
  workflow_dispatch:
    inputs:
      FDIO_NAMESPACE:
        description: "Executor Namespace (prod|sandbox)"
        required: false
        type: choice
        options:
          - sandbox
          - prod
        default: prod
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: true
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.GERRIT_PROJECT }}-${{ inputs.GERRIT_BRANCH }}-${{ inputs.GERRIT_CHANGE_NUMBER }}-${{ inputs.FDIO_NAMESPACE }}
  cancel-in-progress: true

jobs:
  start-verify:
    name: Start Verify
    runs-on: ubuntu-latest
    outputs:
      log_prefix: ${{ steps.start-time.outputs.log_prefix }}

    steps:
      - name: Start Time
        id: start-time
        run: |
          set -euxo pipefail
          timestamp=$(date -u +%Y_%m_%d_%H%M%S_UTC)
          branch=${{ inputs.GERRIT_BRANCH }}
          branch=${branch/\//-}
          log_prefix="gha-vpp-gerrit-patchset/verify-${branch}-${timestamp}-gerrit-${{ inputs.GERRIT_CHANGE_NUMBER }}-${{ inputs.GERRIT_PATCHSET_NUMBER}}"
          echo "log_prefix=$log_prefix" >> "$GITHUB_OUTPUT"
          echo "Gerrit Change: ${{ inputs.GERRIT_CHANGE_URL }}"

      - name: Job Details
        run: |
          {
            echo "### Gerrit Verify Handler"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Gerrit change | ${{ inputs.GERRIT_CHANGE_URL }}/${{ inputs.GERRIT_PATCHSET_NUMBER }} |"
            echo "| Branch | ${{ inputs.GERRIT_BRANCH }} |"
            echo "| Gerrit Change ID | ${{ inputs.GERRIT_CHANGE_ID }} |"
            echo "| Patchset Revision | ${{ inputs.GERRIT_PATCHSET_REVISION }} |"
            echo "| Refspec | ${{ inputs.GERRIT_REFSPEC }} |"
            echo "| Gerrit Event | ${{ inputs.GERRIT_EVENT_TYPE }} |"
            echo "| Gerrit Comment | ${{ inputs.GERRIT_COMMENT }} |"
            echo "| Namespace | ${{ inputs.FDIO_NAMESPACE }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear Gerrit vote
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a5de1d5bf17c2603ae81544dc2a455017b454ec8 # 1.1.1
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_REQUIRED_USER }}
          key: ${{ secrets.GERRIT_SSH_REQUIRED_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ inputs.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
          vote-type: clear
          comment-only: true

  verify-checkstyle:
    name: Checkstyle
    needs:
      - start-verify
    uses: fdio/vpp/.github/workflows/vpp-verify-checkstyle.yml@aea0a31a2b6bba3b9e47feccae473f4206f85704
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_ID: ${{ inputs.GERRIT_CHANGE_ID }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PATCHSET_REVISION: ${{ inputs.GERRIT_PATCHSET_REVISION }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets: inherit

  verify-maketest:
    name: Maketest
    needs:
      - start-verify
      - verify-checkstyle
      - detect-docs-changes
    if: ${{ needs.verify-checkstyle.result == 'success' && needs.detect-docs-changes.outputs.docs_only != 'true' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-maketest.yml@c316a780f8f25c5d2386ef8fa085e90338300e3a
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets: inherit

  verify-gcc:
    name: GCC
    needs:
      - start-verify
      - verify-checkstyle
      - detect-docs-changes
    if: ${{ needs.verify-checkstyle.result == 'success' && needs.detect-docs-changes.outputs.docs_only != 'true' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-gcc.yml@e5c8759e531c155d1aa983fcb0fe84fd1f004c88
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_ID: ${{ inputs.GERRIT_CHANGE_ID }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_EVENT_TYPE: ${{ inputs.GERRIT_EVENT_TYPE }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PATCHSET_REVISION: ${{ inputs.GERRIT_PATCHSET_REVISION }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets: inherit

  verify-csit-api:
    name: CSIT API
    needs:
      - start-verify
      - verify-checkstyle
      - detect-docs-changes
    if: ${{ needs.verify-checkstyle.result == 'success' && needs.detect-docs-changes.outputs.docs_only != 'true' }}
    uses: fdio/vpp/.github/workflows/vpp-csit-verify-api.yml@e5c8759e531c155d1aa983fcb0fe84fd1f004c88
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets: inherit

  verify-arm-drivers:
    name: ARM Drivers
    needs:
      - start-verify
      - verify-checkstyle
      - detect-docs-changes
    if: ${{ needs.verify-checkstyle.result == 'success' && needs.detect-docs-changes.outputs.docs_only != 'true' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-arm-drivers.yml@e5c8759e531c155d1aa983fcb0fe84fd1f004c88
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets: inherit

  verify-hst:
    name: HST
    needs:
      - start-verify
      - verify-checkstyle
      - detect-docs-changes
    if: ${{ needs.verify-checkstyle.result == 'success' && needs.detect-docs-changes.outputs.docs_only != 'true' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-hst.yml@f2443416568f44a73be9d94758f3077a43e8b1f0
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets: inherit

  detect-docs-changes:
    name: Detect Docs Changes
    # Runs in parallel with verify-checkstyle so the docs_only decision is
    # ready by the time checkstyle finishes, adding ~zero latency to the
    # heavy jobs that gate on both.
    needs:
      - start-verify
    runs-on:
      - self-hosted
      - nomad
      - fdio:arch=x86_64
      - fdio:class=builder
      - fdio:namespace=${{ inputs.FDIO_NAMESPACE || 'prod' }}
      - fdio:os=ubuntu2404
      - fdio:size=csit
      - fdio:workflow=${{ github.run_id }}
    outputs:
      docs_changed: ${{ steps.docs-changed.outputs.docs_changed }}
      docs_only: ${{ steps.docs-changed.outputs.docs_only }}
    env:
      WORKSPACE: /scratch/docker-build/vpp
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      TUI_LINE: "*******************************************************************"
    steps:
      - name: Setup Environment
        id: setup-executor-env
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: fdio/.github/.github/actions/setup-executor-env@b728d1589228e2891a4241a1bba362d76895c225

      - name: Checkout VPP Gerrit Change
        id: checkout-vpp
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: fdio/vpp/.github/actions/vpp-checkout-gerrit-change@27fc2aa27f57c8f7055e8f1b6e5a9f41b0315873
        with:
          WORKSPACE: ${{ env.WORKSPACE }}
          GERRIT_BRANCH: ${{ env.GERRIT_BRANCH }}
          GERRIT_REFSPEC: ${{ env.GERRIT_REFSPEC }}
          TUI_LINE: ${{ env.TUI_LINE }}

      - name: Detect docs changes
        id: docs-changed
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout-vpp.outcome }}
        run: |
          set -euxo pipefail

          # docs_changed : at least one docs file was touched (drives the Docs job)
          # docs_only    : every changed file is a docs file (lets us skip the
          #                heavy build/test jobs for documentation-only changes)
          docs_changed="true"
          docs_only="false"
          docs_pattern='(^docs/|\.rst$)'

          if [[ "$CHECKOUT_OUTCOME" == "success" ]]; then
            cd "$WORKSPACE"
            changed_files="$(git diff-tree --no-commit-id --name-only -r --root HEAD)"

            if printf '%s\n' "$changed_files" | grep -Eq "$docs_pattern"; then
              docs_changed="true"
            else
              docs_changed="false"
            fi

            # docs_only is true only when there is at least one changed file and
            # none of the changed files fall outside the docs pattern.
            if [[ -n "$changed_files" ]] && \
               ! printf '%s\n' "$changed_files" | grep -Evq "$docs_pattern"; then
              docs_only="true"
            fi
          else
            # Fail safe: if we cannot inspect the change, run the full pipeline.
            echo "warn: unable to checkout '${GERRIT_REFSPEC}'; defaulting docs_changed=true docs_only=false" >&2
          fi

          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  verify-docs:
    name: Docs
    needs:
      - start-verify
      - detect-docs-changes
      - verify-checkstyle
    if: ${{ needs.verify-checkstyle.result == 'success' && needs.detect-docs-changes.outputs.docs_changed == 'true' }}
    uses: fdio/vpp/.github/workflows/vpp-verify-docs.yml@09552c71554236d36c1eb51a1740a366019bc1a5
    with:
      FDIO_NAMESPACE: ${{ inputs.FDIO_NAMESPACE }}
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      GERRIT_CHANGE_URL: ${{ inputs.GERRIT_CHANGE_URL }}
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      LOG_PREFIX: ${{ needs.start-verify.outputs.log_prefix }}
    secrets: inherit

  final-vote:
    name: Vote
    if: ${{ always() }}
    needs:
      - start-verify
      - detect-docs-changes
      - verify-checkstyle
      - verify-maketest
      - verify-gcc
      - verify-docs
      - verify-csit-api
      - verify-arm-drivers
      - verify-hst
    runs-on: ubuntu-latest
    env:
      GERRIT_CHANGE_NUMBER: ${{ inputs.GERRIT_CHANGE_NUMBER }}
      GERRIT_PATCHSET_NUMBER: ${{ inputs.GERRIT_PATCHSET_NUMBER }}
    steps:
      - name: Collect workflow results
        id: overall
        run: |
          set -euxo pipefail

          # A gated build/test job that is intentionally skipped (docs-only
          # change) must not fail the vote, so accept both success and skipped.
          gated_ok() {
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }

          result="success"

          # These jobs always run and must succeed.
          [[ "${{ needs.start-verify.result }}" == "success" ]] || result="failure"
          [[ "${{ needs.verify-checkstyle.result }}" == "success" ]] || result="failure"
          [[ "${{ needs.detect-docs-changes.result }}" == "success" ]] || result="failure"

          # Heavy jobs: run for non-docs-only changes, skipped otherwise.
          gated_ok "${{ needs.verify-maketest.result }}" || result="failure"
          gated_ok "${{ needs.verify-gcc.result }}" || result="failure"
          gated_ok "${{ needs.verify-csit-api.result }}" || result="failure"
          gated_ok "${{ needs.verify-arm-drivers.result }}" || result="failure"
          gated_ok "${{ needs.verify-hst.result }}" || result="failure"

          # Docs job: required only when docs were actually touched.
          if [[ "${{ needs.detect-docs-changes.outputs.docs_changed }}" == "true" ]]; then
            [[ "${{ needs.verify-docs.result }}" == "success" ]] || result="failure"
          else
            gated_ok "${{ needs.verify-docs.result }}" || result="failure"
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Gerrit Vote
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-review-action@a5de1d5bf17c2603ae81544dc2a455017b454ec8 # 1.1.1
        with:
          host: ${{ vars.GERRIT_SERVER }}
          username: ${{ vars.GERRIT_SSH_USER }}
          key: ${{ secrets.GERRIT_SSH_PRIVKEY }}
          known_hosts: ${{ vars.GERRIT_KNOWN_HOSTS }}
          gerrit-change-number: ${{ env.GERRIT_CHANGE_NUMBER }}
          gerrit-patchset-number: ${{ env.GERRIT_PATCHSET_NUMBER }}
          vote-type: ${{ steps.overall.outputs.result }}
          comment-only: false # Vote on gerrit
