
unix {
  interactive
  # log /home/dmarion/vpp/qppe/vpp.log
  # full-coredump
  # cli-listen /home/dmarion/vpp/qppe/cli.sock
  # exec /home/dmarion/vpp/qppe/startup.vpp
}

api-trace {
  on
}

memory {
  main-heap-size 384M
  # main-heap-page-size 1G
}

cpu {
  # main-core 1
  # corelist-workers 2-3,18-19
}

# buffers {
  # buffers-per-numa 128000
  # page-size default-hugepage
# }

plugins {
  plugin dpdk_plugin.so { disable }
  plugin unittest_plugin.so { enable }
}

devices {
  dev platform/3a000000.ethernet {
    port 5 {
      name lan1
      num-rx-queues 1
      rx-queue-size 512
    }
  }
}

# dpdk {
#  no-pci
#}

statseg {
  size 32m
  # page-size 4k
  # socket-name /home/dmarion/vpp/qppe/stats.sock
}

logging {
  # default-syslog-log-level debug
  class dev { rate-limit 500 level debug syslog-level debug }
  class qppe { rate-limit 500 level debug syslog-level debug }
}
