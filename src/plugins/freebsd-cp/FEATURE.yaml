---
name: FreeBSD Control Plane (integration)
maintainer: Pawel Szymanski <pawel.szymanski@intel.com>

description: |-
        This plugin provides an integration with the FreeBSD network stack.

        It provides the capability to 'mirror' VPP interfaces
        in the FreeBSD kernel. This means that for any interface in VPP the user
        can create a corresponding TAP  device in the FreeBSD kernel
        and have VPP plumb them together.
        The plumbing mechanics is different in each direction.
        In the RX direction, all packets received on a given VPP interface
        that are punted (i.e. are not dropped or forwarded) are transmitted
        on its mirror interface (this includes for example ARP, ND etc,
        so the recommendation is to disable ARP, ND, ping plugin).
        Additionally the plugin gets IPsec NAT-T packets with SPI-zero reason from IPsec
        and sends them to the corresponding TAP interface.
        In the TX direction, packets received by VPP from the mirror TAP device
        are passed to the VPP interface. 
        The plugin synchronizes the IP configuration of the paired interfaces.
        Unlike the Linux control plane plugin, this plugin does not support MPLS, 
        VLANs and namespaces.

state: experimental
properties: [CLI, MULTITHREAD]
